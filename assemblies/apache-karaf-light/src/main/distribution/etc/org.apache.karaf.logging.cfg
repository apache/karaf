# Root log level (TRACE, DEBUG, INFO, WARN, ERROR, OFF)
level = INFO

# Console output threshold (TRACE, DEBUG, INFO, WARN, ERROR, OFF)
console = ${karaf.log.console:-OFF}

# File output (default values). When the file reaches file.maxSize, it's renamed to
# karaf.log.1 (older backups being shifted up to karaf.log.<file.maxBackupIndex>)
#file = ${karaf.log}/karaf.log
#file.maxSize = 10MB
#file.maxBackupIndex = 5

# Logger levels (logger.<name> = <level>)
#logger.org.apache.aries.blueprint = WARN
