#
# Apache Karaf Maven URL Handler configuration
#
# This replaces the pax-url-mvn configuration with a native Karaf implementation.
# Property names are compatible with org.ops4j.pax.url.mvn.* for easier migration.
#

# If set to true, SSL certificate validation is enforced when accessing
# Maven repositories through HTTPS
#
org.apache.karaf.url.mvn.certificateCheck = true

#
# Path to the Maven settings file. If not set, or if the file doesn't exist, the
# first existing file of ${user.home}/.m2/settings.xml, ${maven.home}/conf/settings.xml
# and ${M2_HOME}/conf/settings.xml is used.
# The settings provide the local repository and the remote repositories when they
# are not set below, the credentials of the servers (by repository id), the mirrors
# and the HTTP proxies. The encrypted passwords are not supported. The JDK doesn't
# send the proxy credentials for the HTTPS repositories, unless the Basic scheme is
# enabled with -Djdk.http.auth.tunneling.disabledSchemes=
#
#org.apache.karaf.url.mvn.settings =

#
# Path to the local Maven repository which is used to avoid downloading
# artifacts when they already exist locally.
# Defaults to the local repository of the Maven settings, else to
# ${user.home}/.m2/repository
#
#org.apache.karaf.url.mvn.localRepository =

#
# Comma separated list of default repositories (local, file-based).
# These are checked first, before the local repository and remote repositories.
# If not set, the system repository of the instance, the KAR repositories and the
# system repository of the root instance (as below) are used.
# A repository URL can be appended with:
#    @id=repo.id : the repository identifier
#    @multi      : each sub directory is a repository
#
org.apache.karaf.url.mvn.defaultRepositories = \
    ${karaf.home.uri}${karaf.default.repository}@id=system.repository@snapshots, \
    ${karaf.data.uri}kar@id=kar.repository@multi@snapshots, \
    ${karaf.base.uri}${karaf.default.repository}@id=child.system.repository@snapshots

#
# Comma separated list of remote repositories.
# These are accessed via HTTP/HTTPS (or read for the file: URLs) when the artifact
# is not found locally, and the downloaded artifacts are stored in the local
# repository. A snapshot is resolved from the maven-metadata.xml files of the
# repositories, and the newest version is used.
# If not set, the repositories of the active profiles of the Maven settings are
# used, or Maven Central and the Apache snapshots repository if there are none. If
# the list starts with +, the repositories of the Maven settings are appended.
# The URL can contain credentials (https://user:password@host/path), only sent to
# that host, otherwise the credentials of the server with the repository id in the
# Maven settings are used.
# A repository URL can be appended with:
#    @snapshots  : the repository contains snapshots (not used for the snapshots otherwise)
#    @noreleases : the repository does not contain releases
#    @id=repo.id : the repository identifier
#    @update=policy, @snapshotsUpdate=policy : the update policy of the snapshots
#    @checksum=policy, @releasesChecksum=policy, @snapshotsChecksum=policy :
#                  the checksum policy of the releases and of the snapshots
#
org.apache.karaf.url.mvn.repositories = \
    https://repo1.maven.org/maven2@id=central, \
    https://repository.apache.org/content/groups/snapshots-group@id=apache@snapshots@noreleases

#
# Global update policy: when to check the remote repositories for a newer version
# of a snapshot already in the local repository: always, daily, interval:NNN
# (minutes), never. When set, it overrides the update policies of the
# repositories, daily by default.
#
#org.apache.karaf.url.mvn.globalUpdatePolicy = daily

#
# Global checksum policy: warn, fail, ignore. When set, it overrides the checksum
# policies of the repositories, warn by default.
# With fail, a download is also rejected when the repository has no checksum.
#
#org.apache.karaf.url.mvn.globalChecksumPolicy = warn

#
# Connection and socket timeouts
#
org.apache.karaf.url.mvn.timeout = 5000
org.apache.karaf.url.mvn.socket.connectionTimeout = 5000
org.apache.karaf.url.mvn.socket.readTimeout = 30000

#
# Number of new attempts of a failed download, with an increasing delay. Only the
# errors which may not happen again are retried (server errors, connection reset,
# checksum mismatch), not an unknown host, a refused connection or a timeout.
#
org.apache.karaf.url.mvn.connection.retryCount = 3
