# 1. Online: downloads the build plugins, the framework and its bundles into the local repository
invoker.goals.1 = clean package

# 2. Offline with a bundle that is not in the local repository: must fail, not download it
invoker.goals.2 = -o -Pmissing-bundle package
invoker.buildResult.2 = failure

# 3. Offline with only the artifacts of the first build: must succeed
invoker.goals.3 = -o clean package
